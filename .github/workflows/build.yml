name: Build PanVK driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake glslang-tools pkg-config unzip git \
            llvm-21-dev libclang-21-dev clang-21 libclc-21-dev
          # Ubuntu 24.04 ships Meson 1.3, the build needs 1.4.0 or newer
          pip install --break-system-packages meson mako packaging pyyaml

      # Ubuntu 24.04 and apt.llvm.org have no libllvmspirvlib-21-dev, so build it.
      - name: Build SPIRV-LLVM-Translator for LLVM 21
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          git clone --depth 1 --branch llvm_release_210 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          cmake -S SPIRV-LLVM-Translator -B spirv-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR="$PWD/SPIRV-Headers" \
            -DLLVM_SPIRV_BUILD_EXTERNAL=YES
          ninja -C spirv-build
          sudo ninja -C spirv-build install
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/llvm-21/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PATH=/usr/lib/llvm-21/bin:$PATH" >> "$GITHUB_ENV"

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "NDK_DIR=$PWD/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh "$NDK_DIR"

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver
          path: |
            build-android/libvulkan_panfrost.so
            dist/*
