name: Build PanVK driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools pkg-config unzip \
            llvm-21-dev libclang-21-dev clang-21 libclc-21-dev libllvmspirvlib-21-dev
          # Ubuntu 24.04 ships Meson 1.3, the build needs 1.4.0 or newer
          pip install --break-system-packages meson mako packaging pyyaml

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "NDK_DIR=$PWD/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh "$NDK_DIR"

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver
          path: |
            build-android/libvulkan_panfrost.so
            dist/*
